spring:
  application:
    name: section14-production
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 0.2

# 관측성 — Micrometer/Actuator (교안 14장 1절)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ai-service

# 가드레일 설정 (교안 14장 4절)
guardrail:
  # 입력 필터에서 차단할 인젝션 패턴 (부분 일치)
  injection-patterns: >
    이전 지시 무시,이전 지시를 무시,previous instructions,ignore the above,
    시스템 프롬프트,system prompt,너의 지침,규칙을 무시,jailbreak
  # 출력에서 유출되면 안 되는 시스템 프롬프트 표식
  system-prompt-markers: >
    너는 사내 규정,SYSTEM:,[시스템],당신의 역할은

logging:
  level:
    root: WARN
    com.example.production: INFO
